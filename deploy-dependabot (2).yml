name: Deploy dependabot.yml to org repos

on:
  workflow_dispatch:
    inputs:
      organization:
        description: 'Organization to deploy to'
        type: choice
        options:
          - org-a
          - org-b
          - org-c
      target:
        description: 'Which repos to target'
        type: choice
        options: [specific, all]
        default: specific
      repositories:
        description: 'Comma-separated repo names (used when target = specific)'
        type: string
        required: false
      exclude:
        description: 'Comma-separated repo names to skip (used when target = all)'
        type: string
        required: false
      overwrite:
        description: 'Overwrite dependabot.yml if it already exists'
        type: boolean
        default: false
      create_pr:
        description: 'Open a PR instead of committing to the default branch'
        type: boolean
        default: true
      batch_size:
        description: 'Repos per batch'
        type: number
        default: 20
      dry_run:
        description: 'Dry run (-WhatIf), no changes made'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dependabot-rollout-${{ inputs.organization }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ inputs.organization }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the script uses gh + the App token, not git credentials

      # pwsh and gh are preinstalled on GitHub-hosted Ubuntu runners
      - name: Show tool versions
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          gh --version

      # Token scoped to the selected org. The App must be installed in that org.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEPENDABOT_ROLLOUT_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDABOT_ROLLOUT_APP_KEY }}
          owner: ${{ inputs.organization }}

      - name: Deploy dependabot.yml
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Using a PAT instead? Replace the line above with:
          # GH_TOKEN: ${{ secrets.DEPENDABOT_ROLLOUT_PAT }}
          ORG: ${{ inputs.organization }}
          TARGET: ${{ inputs.target }}
          REPOS: ${{ inputs.repositories }}
          EXCLUDE: ${{ inputs.exclude }}
          OVERWRITE: ${{ inputs.overwrite }}
          CREATE_PR: ${{ inputs.create_pr }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $params = @{
            Organization = $env:ORG
            SourceFile   = '.github/dependabot-template/dependabot.yml'
            BatchSize    = [int]$env:BATCH_SIZE
          }

          if ($env:TARGET -eq 'specific') {
            $list = @($env:REPOS -split '[,\s]+' | Where-Object { $_ })
            if ($list.Count -eq 0) { throw 'Provide "repositories" when target = specific.' }
            $params.Repository = $list
          }
          elseif ($env:EXCLUDE) {
            $params.ExcludeRepository = @($env:EXCLUDE -split '[,\s]+' | Where-Object { $_ })
          }

          if ($env:OVERWRITE -eq 'true') { $params.Overwrite = $true }
          if ($env:CREATE_PR -eq 'true') { $params.CreatePullRequest = $true }
          if ($env:DRY_RUN   -eq 'true') { $params.WhatIf = $true }

          ./scripts/Deploy-DependabotConfig.ps1 @params
